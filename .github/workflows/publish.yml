name: Publish release wheel to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag containing the wheel
        required: true
        default: v1.15.0
      package:
        description: CUDA package variant to publish
        required: true
        type: choice
        options:
          - cu12
          - cu13

concurrency:
  group: pypi-${{ inputs.package }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.package }} from ${{ inputs.tag }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Select release asset
        id: asset
        shell: bash
        env:
          PACKAGE_VARIANT: ${{ inputs.package }}
        run: |
          case "$PACKAGE_VARIANT" in
            cu12)
              echo 'pattern=faiss_gpu_cu12_cuvs-*.whl' >> "$GITHUB_OUTPUT"
              ;;
            cu13)
              echo 'pattern=faiss_gpu_cu13_cuvs-*.whl' >> "$GITHUB_OUTPUT"
              ;;
            *)
              exit 2
              ;;
          esac

      - name: Download one wheel from the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist
          gh release download "$RELEASE_TAG" \
            --pattern "${{ steps.asset.outputs.pattern }}" \
            --dir dist \
            --repo "${{ github.repository }}"
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1

      - name: Validate wheel metadata
        run: |
          python -m pip install --disable-pip-version-check twine==6.2.0
          python -m twine check dist/*.whl

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
